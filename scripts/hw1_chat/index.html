<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel HW1 Chat</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #d9dde5; --accent: #2f5bd3; --user: #e7edfb; --agent: #f1f2f5;
    --tool: #fbf7ea; --warn: #8a5a00; --error: #b3261e; --ok: #1e7a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e4e7ec; --muted: #9aa3b2;
      --border: #2e343e; --accent: #7c9cf0; --user: #22304f; --agent: #242931;
      --tool: #2f2a1c; --warn: #e0b45c; --error: #f2847c; --ok: #6ccf8e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, sans-serif;
         display: flex; height: 100dvh; }
  #sidebar { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;
             padding: 14px 10px; background: var(--panel); border-right: 1px solid var(--border); }
  #sidebar h1 { font-size: 15px; margin: 0 8px 14px; }
  #sidebar button { text-align: left; background: transparent; color: var(--text);
                    border: 0; border-left: 3px solid transparent; border-radius: 6px; padding: 8px 10px; }
  #sidebar button:hover { background: var(--bg); }
  #sidebar button[aria-selected="true"] { background: var(--user); border-left-color: var(--accent); font-weight: 600; }
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 57px;
           padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h2 { font-size: 15px; margin: 0 8px 0 0; }
  header .count { margin-left: auto; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px;
         padding: 16px; width: 100%; max-width: 1200px; margin: 0 auto;
         flex: 1; min-height: 0; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
            min-height: 0; overflow-y: auto; }
  #chatPanel { display: flex; flex-direction: column; }
  @media (max-width: 860px) {
    body { height: auto; min-height: 100dvh; flex-direction: column; }
    #sidebar { width: auto; flex-direction: row; align-items: center; flex-wrap: wrap;
               border-right: 0; border-bottom: 1px solid var(--border); padding: 8px 10px; }
    #sidebar h1 { margin: 0 12px 0 4px; }
    #sidebar button { border-left: 0; border-bottom: 3px solid transparent; }
    #sidebar button[aria-selected="true"] { border-bottom-color: var(--accent); }
    main { grid-template-columns: minmax(0, 1fr); }
    #chatPanel { height: calc(100dvh - 120px); }
  }
  button.secondary { background: transparent; color: var(--error); border-color: var(--error); }
  select, input, textarea, button { font: inherit; color: var(--text); background: var(--bg);
         border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #session { color: var(--muted); margin-bottom: 8px; }
  #log { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; }
  .msg { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { background: var(--user); align-self: flex-end; max-width: 85%; }
  .agent { background: var(--agent); max-width: 85%; }
  .tool { background: var(--tool); font: 12px/1.4 ui-monospace, monospace; }
  .tool summary { cursor: pointer; }
  .note { color: var(--warn); font-size: 13px; }
  .error { color: var(--error); }
  #composer { display: flex; gap: 8px; margin-top: 10px; }
  #composer textarea { flex: 1; resize: vertical; min-height: 40px; }
  form label { display: block; margin: 10px 0 4px; font-weight: 600; }
  form textarea, form select { width: 100%; }
  form .radio { display: flex; gap: 14px; font-weight: normal; }
  #recordStatus { margin-top: 8px; }
  .ok { color: var(--ok); }
  #chatControls { display: contents; }
  [hidden] { display: none !important; }
  #recordsView, #dbView { max-width: none; }
  #recordsView { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  #recordsTable td { white-space: nowrap; }
  #filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  #filters input { flex: 1; min-width: 140px; }
  #recordsTable { width: 100%; border-collapse: collapse; font-size: 13px; }
  #recordsTable th, #recordsTable td { text-align: left; padding: 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #recordsTable th { position: sticky; top: -12px; background: var(--panel); }
  #recordsTable tbody tr { cursor: pointer; }
  #recordsTable tbody tr:hover, #recordsTable tbody tr.selected { background: var(--user); }
  #recordsTable td.clip { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #recordsTable td.tools { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .pill { white-space: nowrap; display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px; border: 1px solid currentColor; }
  .pass { color: var(--ok); } .fail { color: var(--error); }
  #summary { color: var(--muted); margin-bottom: 8px; font-size: 13px; }
  #detail h3 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  #detail h3:first-child { margin-top: 0; }
  #detail .msg { margin-bottom: 6px; }
  #detail pre { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 860px) { #recordsView { grid-template-columns: minmax(0, 1fr); } }
  #dbView { grid-template-columns: minmax(0, 1fr); }
  #dbView section { display: flex; flex-direction: column; }
  #dbFilters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #dbPager { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--muted); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  #dbNote { color: var(--muted); font-size: 13px; margin: 8px 0; }
  #dbScroll { flex: 1; min-height: 0; overflow: auto; }
  #dbGrid { border-collapse: collapse; font: 12px/1.4 ui-monospace, monospace; }
  #dbGrid th, #dbGrid td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border);
                           white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  #dbGrid th { position: sticky; top: 0; background: var(--panel); }
  #dbGrid td.null { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<nav id="sidebar" role="tablist" aria-orientation="vertical">
  <h1>Cartwheel HW1</h1>
  <button role="tab" id="tabChat" aria-selected="true">Chat</button>
  <button role="tab" id="tabRecords" aria-selected="false">Records</button>
  <button role="tab" id="tabDb" aria-selected="false">DB</button>
</nav>
<div id="content">
<header>
  <h2 id="viewTitle">Chat</h2>
  <span id="chatControls">
    <select id="role" aria-label="Role">
      <option value="shopper">shopper</option>
      <option value="merchant">merchant</option>
      <option value="support">support</option>
    </select>
    <select id="user" aria-label="User"></select>
    <input id="model" placeholder="model (default)" size="16" aria-label="Model">
    <button id="newChat">New chat</button>
  </span>
  <span class="count" id="count"></span>
  <button id="reset" class="secondary" title="Regenerate data/cartwheel.db, like uv run python -m seed.generate">Reset DB</button>
</header>
<main id="recordsView" hidden>
  <section>
    <div id="filters">
      <select id="fRole" aria-label="Filter by role"><option value="">all roles</option><option>shopper</option><option>merchant</option><option>support</option></select>
      <select id="fMet" aria-label="Filter by result"><option value="">all results</option><option value="true">met</option><option value="false">not met</option></select>
      <select id="fReq" aria-label="Filter by requirement"><option value="">all requirements</option></select>
      <input id="fText" placeholder="Search request or response" aria-label="Search">
    </div>
    <div id="summary"></div>
    <table id="recordsTable">
      <thead><tr><th>#</th><th>role · user</th><th>request</th><th>req.</th><th>met</th><th>source</th><th>tools</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section id="detail"><span class="note" style="color:var(--muted)">Select a record to see it in full.</span></section>
</main>
<main id="dbView" hidden>
  <section>
    <form id="dbFilters">
      <select id="dbTable" aria-label="Table"></select>
      <select id="dbColumn" aria-label="Filter column"><option value="">no filter</option></select>
      <input id="dbValue" placeholder="equals value" aria-label="Filter value">
      <button type="submit">Apply</button>
      <button type="button" id="dbClear" class="ghost">Clear</button>
      <span id="dbPager">
        <button type="button" id="dbPrev" class="ghost">‹ Prev</button>
        <span id="dbInfo"></span>
        <button type="button" id="dbNext" class="ghost">Next ›</button>
      </span>
    </form>
    <div id="dbNote">Read-only view of the world database, newest rows first. Shows every role's data, without the agent's permission checks.</div>
    <div id="dbScroll"><table id="dbGrid"><thead></thead><tbody></tbody></table></div>
  </section>
</main>
<main id="chatView">
  <section id="chatPanel">
    <div id="session">Choose a role and user, then start a new chat.</div>
    <div id="log"></div>
    <div id="composer">
      <textarea id="input" placeholder="Type a message (Enter sends, Shift+Enter adds a new line)" disabled></textarea>
      <button id="send" disabled>Send</button>
    </div>
  </section>
  <section>
    <form id="judgment">
      <strong>Record this conversation</strong>
      <label for="expected">expected</label>
      <textarea id="expected" rows="4" placeholder="Behavior implied by SPEC.md"></textarea>
      <label for="requirement">requirement</label>
      <select id="requirement"><option value="">null (no single requirement)</option></select>
      <label>met_requirement</label>
      <div class="radio">
        <label><input type="radio" name="met" value="true"> true</label>
        <label><input type="radio" name="met" value="false"> false</label>
      </div>
      <label for="source">problem_source</label>
      <select id="source" disabled>
        <option value="">null</option>
        <option value="prompt">prompt</option>
        <option value="tool">tool</option>
        <option value="specification">specification</option>
      </select>
      <button id="record" type="submit" style="margin-top:12px" disabled>Record line</button>
      <div id="recordStatus"></div>
    </form>
  </section>
</main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const STATE_CHANGING = new Set(["issue_refund", "cancel_order"]);
let users = [];
let chat = null;
let turns = 0;
let busy = false;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || res.statusText));
  return data;
}

function fillUsers() {
  const role = $("role").value;
  $("user").innerHTML = "";
  for (const u of users.filter((u) => u.role === role)) {
    const opt = document.createElement("option");
    opt.value = u.id;
    opt.textContent = `${u.id} · ${u.name}` + (u.store_id ? ` · store ${u.store_id}` : "");
    $("user").append(opt);
  }
}

function add(cls, text) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  $("log").append(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

function addTool(call) {
  const details = document.createElement("details");
  details.className = "msg tool";
  const summary = document.createElement("summary");
  summary.textContent = `[tool] ${call.name}(${JSON.stringify(call.arguments)})`;
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(call.result, null, 2);
  details.append(summary, pre);
  $("log").append(details);
}

async function refreshCount() {
  const r = await api("/api/records");
  $("count").textContent = `${r.path}: ${r.count} record${r.count === 1 ? "" : "s"}`;
}

function updateControls() {
  const open = chat && !chat.recorded;
  $("input").disabled = !open || busy;
  $("send").disabled = !open || busy;
  const met = document.querySelector("input[name=met]:checked");
  $("source").disabled = !met || met.value === "true";
  if ($("source").disabled) $("source").value = "";
  $("record").disabled = !open || busy || turns === 0;
  $("reset").disabled = busy;
}

$("reset").addEventListener("click", async () => {
  const unrecorded = chat && !chat.recorded && turns > 0;
  const msg = "Regenerate the database? Refunds, cancellations, and escalations made in earlier chats are erased. "
    + "hw1-session.jsonl is kept."
    + (unrecorded ? "\n\nThe current conversation has not been recorded and will be closed." : "");
  if (!confirm(msg)) return;
  busy = true; updateControls();
  try {
    await api("/api/reset", {});
    chat = null; turns = 0;
    $("log").innerHTML = "";
    $("judgment").reset();
    $("recordStatus").textContent = "";
    $("session").textContent = "Database reset to the seeded state. Start a new chat.";
    if (!$("dbView").hidden) loadTables();
  } catch (e) {
    $("session").textContent = "";
    $("session").append(Object.assign(document.createElement("span"), { className: "error", textContent: `Reset failed: ${e.message}` }));
  }
  busy = false; updateControls();
});

$("role").addEventListener("change", fillUsers);
document.querySelectorAll("input[name=met]").forEach((r) => r.addEventListener("change", updateControls));

$("newChat").addEventListener("click", async () => {
  if (chat && !chat.recorded && turns > 0 && !confirm("This conversation has not been recorded. Start a new chat anyway?")) return;
  try {
    chat = await api("/api/chats", { role: $("role").value, user_id: Number($("user").value), model: $("model").value.trim() || null });
    turns = 0;
    $("log").innerHTML = "";
    $("judgment").reset();
    $("recordStatus").textContent = "";
    $("session").textContent = `role=${chat.role} user=${chat.user_id} store=${chat.store_id ?? "null"} prompt_version=${chat.prompt_version}`;
    updateControls();
    $("input").focus();
  } catch (e) {
    $("session").innerHTML = "";
    $("session").append(Object.assign(document.createElement("span"), { className: "error", textContent: e.message }));
  }
});

async function send() {
  const text = $("input").value.trim();
  if (!text || !chat) return;
  add("user", text);
  $("input").value = "";
  busy = true; updateControls();
  const pending = add("agent", "…");
  try {
    const turn = await api(`/api/chats/${chat.chat_id}/messages`, { message: text });
    pending.remove();
    turn.tool_calls.forEach(addTool);
    add("agent", turn.response);
    if (turn.tool_calls.some((c) => STATE_CHANGING.has(c.name) && c.result && c.result.ok)) {
      add("note", "This conversation changed the database. Run `uv run python -m seed.generate` before another conversation that needs the original order state.");
    }
    turns += 1;
  } catch (e) {
    pending.className = "msg agent error";
    pending.textContent = `Error: ${e.message}`;
  }
  busy = false; updateControls();
  $("input").focus();
}

$("send").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

$("judgment").addEventListener("submit", async (e) => {
  e.preventDefault();
  const met = document.querySelector("input[name=met]:checked");
  const status = $("recordStatus");
  if (!met) { status.className = "error"; status.textContent = "Choose met_requirement."; return; }
  try {
    const r = await api(`/api/chats/${chat.chat_id}/record`, {
      expected: $("expected").value,
      requirement: $("requirement").value || null,
      met_requirement: met.value === "true",
      problem_source: $("source").value || null,
    });
    chat.recorded = true;
    status.className = "ok";
    status.textContent = `Recorded. The file now has ${r.count} records. Start a new chat for the next conversation.`;
    refreshCount();
  } catch (err) {
    status.className = "error";
    status.textContent = err.message;
  }
  updateControls();
});

// ---- Records tab (read-only view of hw1-session.jsonl) ----
let rows = [];
let selectedLine = null;
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};

const TABS = { chat: ["tabChat", "chatView"], records: ["tabRecords", "recordsView"], db: ["tabDb", "dbView"] };
function showTab(name) {
  for (const [key, [tab, view]] of Object.entries(TABS)) {
    $(tab).setAttribute("aria-selected", String(key === name));
    $(view).hidden = key !== name;
  }
  $("chatControls").hidden = name !== "chat";
  $("viewTitle").textContent = $(TABS[name][0]).textContent;
  if (name === "records") loadRecords();
  if (name === "db") loadTables();
}
$("tabChat").addEventListener("click", () => showTab("chat"));
$("tabRecords").addEventListener("click", () => showTab("records"));
$("tabDb").addEventListener("click", () => showTab("db"));

async function loadRecords() {
  try {
    rows = (await api("/api/records/lines")).records;
  } catch (e) {
    $("summary").textContent = `Could not load records: ${e.message}`;
    return;
  }
  const current = $("fReq").value;
  const ids = [...new Set(rows.filter((r) => r.record).map((r) => r.record.requirement ?? "null"))].sort();
  $("fReq").replaceChildren(el("option", { value: "", textContent: "all requirements" }),
    ...ids.map((id) => el("option", { value: id, textContent: id })));
  $("fReq").value = ids.includes(current) ? current : "";
  renderRecords();
}

function matches(row) {
  if (!row.record) return true;
  const r = row.record;
  const text = $("fText").value.trim().toLowerCase();
  return (!$("fRole").value || r.role === $("fRole").value)
    && (!$("fMet").value || String(r.met_requirement) === $("fMet").value)
    && (!$("fReq").value || (r.requirement ?? "null") === $("fReq").value)
    && (!text || `${r.request}\n${r.response}`.toLowerCase().includes(text));
}

function renderRecords() {
  const shown = rows.filter(matches);
  const valid = shown.filter((r) => r.record);
  const met = valid.filter((r) => r.record.met_requirement).length;
  $("summary").textContent = `${shown.length} of ${rows.length} records · ${met} met · ${valid.length - met} not met`;
  $("recordsTable").tBodies[0].replaceChildren(...shown.map((row) => {
    if (!row.record) {
      return el("tr", {}, el("td", { textContent: row.line }),
        el("td", { colSpan: 6, className: "error", textContent: row.error }));
    }
    const r = row.record;
    const toolNames = (r.tool_calls || []).map((c) => c.name).join(", ") || "none";
    const tr = el("tr", { className: row.line === selectedLine ? "selected" : "" },
      el("td", { textContent: row.line }),
      el("td", { textContent: `${r.role} · ${r.user_id}` }),
      el("td", { className: "clip", textContent: r.request, title: r.request }),
      el("td", { textContent: r.requirement ?? "null" }),
      el("td", {}, el("span", { className: `pill ${r.met_requirement ? "pass" : "fail"}`, textContent: r.met_requirement ? "met" : "not met" })),
      el("td", { textContent: r.problem_source ?? "" }),
      el("td", { className: "tools", textContent: toolNames, title: toolNames }));
    tr.addEventListener("click", () => { selectedLine = row.line; renderRecords(); renderDetail(r, row.line); });
    return tr;
  }));
}

function renderDetail(r, line) {
  const field = (label, value) => [el("h3", { textContent: label }), el("div", { textContent: value ?? "null" })];
  const tools = (r.tool_calls || []).map((c) => {
    const d = el("details", { className: "msg tool", open: true },
      el("summary", { textContent: `${c.name}(${JSON.stringify(c.arguments)})` }),
      el("pre", { textContent: JSON.stringify(c.result, null, 2) }));
    return d;
  });
  $("detail").replaceChildren(
    el("h3", { textContent: `Line ${line} · ${r.role} · user ${r.user_id} · store ${r.store_id ?? "null"}` }),
    el("h3", { textContent: "request" }), el("div", { className: "msg user", textContent: r.request }),
    el("h3", { textContent: `tool_calls (${tools.length})` }), ...(tools.length ? tools : [el("div", { textContent: "none" })]),
    el("h3", { textContent: "response" }), el("div", { className: "msg agent", textContent: r.response }),
    ...field("expected", r.expected),
    ...field("requirement", r.requirement),
    el("h3", { textContent: "met_requirement" }),
    el("span", { className: `pill ${r.met_requirement ? "pass" : "fail"}`, textContent: String(r.met_requirement) }),
    ...field("problem_source", r.problem_source),
  );
}

// ---- DB tab (read-only table browser) ----
let tables = [];
let dbPage = 1;

async function loadTables() {
  const current = $("dbTable").value;
  try {
    tables = (await api("/api/db/tables")).tables;
  } catch (e) {
    $("dbNote").textContent = `Could not load tables: ${e.message}`;
    return;
  }
  $("dbTable").replaceChildren(...tables.map((t) => el("option", { value: t.name, textContent: `${t.name} (${t.rows})` })));
  $("dbTable").value = tables.some((t) => t.name === current) ? current : (tables.find((t) => t.name === "orders") || tables[0]).name;
  fillColumns();
  loadRows();
}

function fillColumns() {
  const table = tables.find((t) => t.name === $("dbTable").value);
  $("dbColumn").replaceChildren(el("option", { value: "", textContent: "no filter" }),
    ...(table ? table.columns : []).map((c) => el("option", { value: c, textContent: c })));
}

async function loadRows() {
  const params = new URLSearchParams({ page: dbPage });
  if ($("dbColumn").value && $("dbValue").value !== "") {
    params.set("column", $("dbColumn").value);
    params.set("value", $("dbValue").value);
  }
  let data;
  try {
    data = await api(`/api/db/tables/${encodeURIComponent($("dbTable").value)}?${params}`);
  } catch (e) {
    $("dbInfo").textContent = "";
    $("dbGrid").tHead.replaceChildren();
    $("dbGrid").tBodies[0].replaceChildren(el("tr", {}, el("td", { className: "error", textContent: e.message })));
    return;
  }
  const pages = Math.max(1, Math.ceil(data.total / data.page_size));
  $("dbInfo").textContent = `page ${data.page} of ${pages} · ${data.total} rows`;
  $("dbPrev").disabled = data.page <= 1;
  $("dbNext").disabled = data.page >= pages;
  $("dbGrid").tHead.replaceChildren(el("tr", {}, ...data.columns.map((c) => el("th", { textContent: c }))));
  $("dbGrid").tBodies[0].replaceChildren(...data.rows.map((row) => el("tr", {}, ...row.map((v) =>
    v === null ? el("td", { className: "null", textContent: "null" }) : el("td", { textContent: String(v), title: String(v) })))));
}

$("dbTable").addEventListener("change", () => { $("dbValue").value = ""; dbPage = 1; fillColumns(); loadRows(); });
$("dbFilters").addEventListener("submit", (e) => { e.preventDefault(); dbPage = 1; loadRows(); });
$("dbClear").addEventListener("click", () => { $("dbColumn").value = ""; $("dbValue").value = ""; dbPage = 1; loadRows(); });
$("dbPrev").addEventListener("click", () => { dbPage -= 1; loadRows(); });
$("dbNext").addEventListener("click", () => { dbPage += 1; loadRows(); });

["fRole", "fMet", "fReq"].forEach((id) => $(id).addEventListener("change", renderRecords));
$("fText").addEventListener("input", renderRecords);

(async () => {
  users = (await api("/api/users")).users;
  fillUsers();
  for (const id of (await api("/api/requirements")).requirements) {
    $("requirement").append(Object.assign(document.createElement("option"), { value: id, textContent: id }));
  }
  refreshCount();
})();
</script>
</body>
</html>
